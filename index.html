<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Justicia Social | Programa Pro Bono CIMAJ - Pichincha</title>

  <!-- Metadatos Open Graph para vista previa enriquecida en WhatsApp -->
  <meta property="og:title" content="Justicia Social | Programa Pro Bono CIMAJ" />
  <meta property="og:description" content="Asesoría y patrocinio jurídico gratuito en Derecho de Familia y Divorcios básicos en alianza con Fundación Reina de Pichincha y Prefectura de Pichincha." />
  <meta property="og:type" content="website" />
  <!-- Si subes una imagen portada.jpg a tu repo, descomenta la siguiente línea y pon tu URL completa de GitHub Pages: -->
  <!-- <meta property="og:image" content="https://TU-USUARIO.github.io/TU-REPOSITORIO/portada.jpg" /> -->

  <!-- Librerías CDN: PDF.js y StPageFlip -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --gold: #c5a059;
      --gold-light: #e2c275;
      --text-light: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
      color: var(--text-light);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* Barra superior institucional */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid rgba(197, 160, 89, 0.3);
      z-index: 20;
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--gold-light);
      letter-spacing: 0.5px;
    }

    .brand-sub {
      font-size: 0.72rem;
      color: #cbd5e1;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      background: rgba(197, 160, 89, 0.15);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .btn:hover, .btn:active {
      background: var(--gold);
      color: #0f172a;
    }

    .btn-wa {
      background: #16a34a;
      border-color: #22c55e;
      color: #ffffff;
    }

    /* Contenedor principal del Flipbook */
    #viewer-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 12px;
      overflow: hidden;
    }

    #flipbook {
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
      display: none;
    }

    .page {
      background-color: #ffffff;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Pantalla de carga */
    #loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(197, 160, 89, 0.25);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Barra inferior de navegación */
    footer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid rgba(197, 160, 89, 0.25);
      z-index: 20;
    }

    .nav-btn {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:active {
      background: var(--gold);
      color: #000;
    }

    #page-indicator {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--gold-light);
      min-width: 90px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-title">CIMAJ · Justicia Social</span>
      <span class="brand-sub">Programa Pro Bono 2026</span>
    </div>
    <div class="actions">
      <a href="Justicia-Social.pdf" download class="btn" title="Descargar PDF">⬇ PDF</a>
      <a href="https://wa.me/593998877398?text=Hola%20CIMAJ,%20vengo%20del%20Book%20Institucional%20Justicia%20Social%20Pro%20Bono" target="_blank" class="btn btn-wa">WhatsApp</a>
    </div>
  </header>

  <main id="viewer-container">
    <div id="loader">
      <div class="spinner"></div>
      <p id="loader-text" style="font-size: 0.9rem; color: #e2e8f0;">Cargando brochure interactivo...</p>
    </div>
    <div id="flipbook"></div>
  </main>

  <footer>
    <button class="nav-btn" id="btn-prev" aria-label="Página anterior">❮</button>
    <span id="page-indicator">1 / 8</span>
    <button class="nav-btn" id="btn-next" aria-label="Página siguiente">❯</button>
  </footer>

  <script>
    const PDF_URL = 'Justicia-Social.pdf';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pageFlip = null;
    let totalPages = 0;

    async function initFlipbook() {
      try {
        const loadingTask = pdfjsLib.getDocument(PDF_URL);
        const pdf = await loadingTask.promise;
        totalPages = pdf.numPages;

        const flipbookEl = document.getElementById('flipbook');
        const loaderText = document.getElementById('loader-text');

        // Obtener dimensiones reales de la primera página
        const firstPage = await pdf.getPage(1);
        const baseViewport = firstPage.getViewport({ scale: 1 });
        const aspectRatio = baseViewport.width / baseViewport.height;

        // Renderizar cada página del PDF en alta nitidez
        for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
          loaderText.textContent = `Preparando página ${pageNum} de ${totalPages}...`;
          const page = await pdf.getPage(pageNum);
          // Escala 2.2 para máxima nitidez en textos y código QR
          const viewport = page.getViewport({ scale: 2.2 });

          const pageDiv = document.createElement('div');
          pageDiv.className = 'page';

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.width = viewport.width;
          canvas.height = viewport.height;

          await page.render({
            canvasContext: context,
            viewport: viewport
          }).promise;

          pageDiv.appendChild(canvas);
          flipbookEl.appendChild(pageDiv);
        }

        // Calcular tamaño óptimo según pantalla (móvil vertical vs escritorio)
        const container = document.getElementById('viewer-container');
        const isMobile = window.innerWidth < 768;
        const maxHeight = container.clientHeight - 20;
        const maxWidth = isMobile ? (container.clientWidth - 16) : ((container.clientWidth - 40) / 2);

        let pageHeight = maxHeight;
        let pageWidth = pageHeight * aspectRatio;

        if (pageWidth > maxWidth) {
          pageWidth = maxWidth;
          pageHeight = pageWidth / aspectRatio;
        }

        document.getElementById('loader').style.display = 'none';
        flipbookEl.style.display = 'block';

        pageFlip = new St.PageFlip(flipbookEl, {
          width: Math.floor(pageWidth),
          height: Math.floor(pageHeight),
          size: 'fixed',
          minWidth: 250,
          maxWidth: 1000,
          minHeight: 350,
          maxHeight: 1400,
          showCover: true,
          mobileScrollSupport: false,
          usePortrait: isMobile, // 1 página en celular vertical, 2 páginas tipo libro en PC
          flippingTime: 700,
          maxShadowOpacity: 0.5
        });

        pageFlip.loadFromHTML(document.querySelectorAll('.page'));

        updateIndicator(0);

        pageFlip.on('flip', (e) => {
          updateIndicator(e.data);
        });

        document.getElementById('btn-prev').addEventListener('click', () => pageFlip.flipPrev());
        document.getElementById('btn-next').addEventListener('click', () => pageFlip.flipNext());

      } catch (err) {
        document.getElementById('loader-text').textContent = 'Error al cargar Justicia-Social.pdf. Verifica que el archivo esté en la misma carpeta.';
        console.error(err);
      }
    }

    function updateIndicator(currentIndex) {
      document.getElementById('page-indicator').textContent = `${currentIndex + 1} / ${totalPages}`;
    }

    window.addEventListener('DOMContentLoaded', initFlipbook);
  </script>
</body>
</html>
